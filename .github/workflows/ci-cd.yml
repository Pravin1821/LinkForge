name: LinkForge CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  FRONTEND_IMAGE: pravin1821/linkforge:frontend
  BACKEND_IMAGE: pravin1821/linkforge:backend

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./server
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Frontend
        working-directory: ./client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: ${{ env.FRONTEND_IMAGE }}

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs:
      - docker
    steps:
      - name: Deploy Backend
        run: curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Deploy Frontend
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

  health-check:
    name: Check Deployment
    runs-on: ubuntu-latest
    needs:
      - deploy
    env:
      DEPLOY_BACKEND_URL: "https://linkforge-tdgx.onrender.com"
      DEPLOY_FRONTEND_URL: "https://link-forge-pi.vercel.app"
    steps:
      - name: Validate deployment URLs
        run: |
          for endpoint in DEPLOY_BACKEND_URL DEPLOY_FRONTEND_URL; do
            url="${!endpoint}"
            if [[ "$url" =~ ^https?://(localhost|127\.0\.0\.1)(:|/) ]]; then
              echo "${endpoint} points to '$url'. Health checks run on GitHub-hosted runners and require a public deployed URL."
              exit 1
            fi
          done

      - name: Check Backend
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 10 "$DEPLOY_BACKEND_URL"; then
              exit 0
            fi
            echo "Backend is not ready (attempt ${attempt}/12); retrying in 10 seconds..."
            sleep 10
          done
          echo "Backend did not become ready in time."
          exit 1

      - name: Check Frontend
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location --max-time 10 "$DEPLOY_FRONTEND_URL"; then
              exit 0
            fi
            echo "Frontend is not ready (attempt ${attempt}/12); retrying in 10 seconds..."
            sleep 10
          done
          echo "Frontend did not become ready in time."
          exit 1

  success-email:
    name: Send Success Email
    runs-on: ubuntu-latest
    if: success()
    needs:
      - health-check
    steps:
      - name: Send Success Email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "LinkForge Deployment Successful"
          to: pravincriss21@gmail.com
          from: "LinkForge Deployment <${{ secrets.MAIL_USERNAME }}>"
          body: |
            LinkForge deployment succeeded.
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Frontend: ${{ secrets.FRONTEND_URL }}
            Backend: ${{ secrets.BACKEND_URL }}

  failure-email:
    name: Send Failure Email
    runs-on: ubuntu-latest
    if: failure()
    needs:
      - test
      - docker
      - deploy
      - health-check
    steps:
      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "LinkForge Deployment Failed"
          to: pravincriss21@gmail.com
          from: "LinkForge Deployment <${{ secrets.MAIL_USERNAME }}>"
          body: |
            LinkForge deployment failed.
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Check: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
