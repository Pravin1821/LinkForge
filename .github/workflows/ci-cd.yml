name: LinkForge CI/CD

# ============================================================
# TRIGGER
# ============================================================
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ============================================================
# GLOBAL ENVIRONMENT VARIABLES
# ============================================================
env:
  NODE_VERSION: 20
  FRONTEND_IMAGE: pravin1821/linkforge:frontend
  BACKEND_IMAGE: pravin1821/linkforge:backend

# ============================================================
# JOBS
# ============================================================
jobs:

  # ==========================================================
  # JOB 1: TEST
  # ==========================================================
  test:
    name: Test Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: v24.18.0

      - name: Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: Run Backend Tests
        working-directory: ./server
        run: npm test

      - name: Install Frontend Dependencies
        working-directory: ./client
        run: npm ci

      - name: Build Frontend
        working-directory: ./client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

  # ==========================================================
  # JOB 2: BUILD AND PUSH DOCKER IMAGES
  # ==========================================================
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs:
      - test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------
      # Backend image
      # ------------------------------------------------------
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      # ------------------------------------------------------
      # Frontend image
      # ------------------------------------------------------
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # ==========================================================
  # JOB 3: DEPLOY
  # ==========================================================
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs:
      - docker
    steps:
      - name: Deploy Backend
        run: curl -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"

      - name: Deploy Frontend
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

  # ==========================================================
  # JOB 4: HEALTH CHECK
  # ==========================================================
  health-check:
    name: Check Deployment
    runs-on: ubuntu-latest
    needs:
      - deploy
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Check Backend
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            "${{ secrets.BACKEND_URL }}"

      - name: Check Frontend
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 10 \
            "${{ secrets.FRONTEND_URL }}"

  # ==========================================================
  # JOB 5: SUCCESS EMAIL
  # ==========================================================
  success-email:
    name: Send Success Email
    runs-on: ubuntu-latest
    if: success()
    needs:
      - health-check
    steps:
      - name: Send Success Email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "LinkForge Deployment Successful"
          to: pravincriss21@gmail.com
          from: "LinkForge Deployment <${{ secrets.MAIL_USERNAME }}>"
          body: |
            ========================================
                  LINKFORGE DEPLOYMENT SUCCESS
            ========================================

            Repository: ${{ github.repository }}
            Branch:     ${{ github.ref_name }}
            Commit:     ${{ github.sha }}

            Frontend: ${{ secrets.FRONTEND_URL }}
            Backend:  ${{ secrets.BACKEND_URL }}

            Docker Hub Images:
              Frontend: ${{ env.FRONTEND_IMAGE }}:latest
              Backend:  ${{ env.BACKEND_IMAGE }}:latest

            Status: SUCCESS
              - Tests passed
              - Docker images built
              - Docker images pushed to Docker Hub
              - Deployment completed
              - Health checks passed
            ========================================

  # ==========================================================
  # JOB 6: FAILURE EMAIL
  # ==========================================================
  failure-email:
    name: Send Failure Email
    runs-on: ubuntu-latest
    if: failure()
    needs:
      - test
      - docker
      - deploy
      - health-check
    steps:
      - name: Send Failure Email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "LinkForge Deployment Failed"
          to: pravincriss21@gmail.com
          from: "LinkForge Deployment <${{ secrets.MAIL_USERNAME }}>"
          body: |
            ========================================
                    LINKFORGE DEPLOYMENT FAILED
            ========================================

            Repository: ${{ github.repository }}
            Branch:     ${{ github.ref_name }}
            Commit:     ${{ github.sha }}

            The CI/CD pipeline failed.
            Check GitHub Actions:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Status: FAILED
            ========================================